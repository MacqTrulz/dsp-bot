name: DSP Dünya Durumu

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15 dakikada bir, yoğun olmayan dakikalarda (tam saat başı GitHub'da atlanabiliyor)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write             # state.json ve avatarları kaydedebilmek için

concurrency:
  group: dunya-durumu
  cancel-in-progress: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Git kimliği
        run: |
          git config user.name "dsp-dunya-durumu"
          git config user.email "dsp-dunya-durumu@users.noreply.github.com"

      - name: Avatarları üret (sadece eksikse)
        run: |
          if [ ! -f img/haber.png ]; then
            sudo apt-get install -y -qq librsvg2-bin >/dev/null
            python tools/avatar_uret.py
            for f in img/*.svg; do rsvg-convert -w 256 -h 256 "$f" -o "${f%.svg}.png"; done
            git add img/*.png img/*.svg
            git commit -m "Bot avatarları üretildi" && git pull --rebase -q && git push
          fi

      - name: Bildirimleri gönder
        env:
          WH_PANO: ${{ secrets.WH_PANO }}
          WH_BARO: ${{ secrets.WH_BARO }}
          WH_SORTIE: ${{ secrets.WH_SORTIE }}
          WH_FISSURE: ${{ secrets.WH_FISSURE }}
          WH_NIGHTWAVE: ${{ secrets.WH_NIGHTWAVE }}
          WH_HABER: ${{ secrets.WH_HABER }}
          ROLE_BARO: ${{ vars.ROLE_BARO }}
          ROLE_SORTIE: ${{ vars.ROLE_SORTIE }}
          ROLE_NIGHTWAVE: ${{ vars.ROLE_NIGHTWAVE }}
          ROLE_FARM: ${{ vars.ROLE_FARM }}
          ROLE_FISSURE: ${{ vars.ROLE_FISSURE }}
          ROLE_HABER: ${{ vars.ROLE_HABER }}
          FISSURE_TIERS: ${{ vars.FISSURE_TIERS }}
          INVASION_ITEMS: ${{ vars.INVASION_ITEMS }}
        run: python wf_bildirim.py

      - name: Durumu kaydet
        run: |
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Dünya durumu güncellendi" && git pull --rebase -q && git push)
